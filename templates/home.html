<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forest Fire Prediction</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #141e30,
                #243b55
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }


        .container {
            width: 100%;
            max-width: 950px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3);
        }


        h1 {
            text-align: center;
            color: #222;

            margin-bottom: 10px;
        }


        .subtitle {
            text-align: center;
            color: #666;

            margin-bottom: 30px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        .field {

            display: flex;

            flex-direction: column;
        }


        label {

            font-weight: bold;

            margin-bottom: 7px;

            color: #333;
        }


        input {

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #ff5722;
        }


        button {

            width: 100%;

            margin-top: 30px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #ff5722;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #e64a19;
        }


        .result {

            margin-top: 25px;

            padding: 20px;

            border-radius: 10px;

            background: #e8f5e9;

            text-align: center;

            color: #1b5e20;
        }


        @media (max-width: 700px) {

            .form-grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>🔥 Forest Fire Prediction</h1>


    <p class="subtitle">
        Enter the environmental conditions to predict forest fire.
    </p>


    <form
        action="{{ url_for('predict_datapoints') }}"
        method="post"
    >


        <div class="form-grid">


            <!-- Day -->

            <div class="field">

                <label>Day</label>

                <input
                    type="number"
                    name="day"
                    required
                >

            </div>


            <!-- Month -->

            <div class="field">

                <label>Month</label>

                <input
                    type="number"
                    name="month"
                    required
                >

            </div>


            <!-- Year -->

            <div class="field">

                <label>Year</label>

                <input
                    type="number"
                    name="year"
                    required
                >

            </div>


            <!-- Temperature -->

            <div class="field">

                <label>Temperature</label>

                <input
                    type="number"
                    step="any"
                    name="Temperature"
                    required
                >

            </div>


            <!-- RH -->

            <div class="field">

                <label>RH</label>

                <input
                    type="number"
                    step="any"
                    name="RH"
                    required
                >

            </div>


            <!-- Ws -->

            <div class="field">

                <label>Wind Speed (Ws)</label>

                <input
                    type="number"
                    step="any"
                    name="Ws"
                    required
                >

            </div>


            <!-- Rain -->

            <div class="field">

                <label>Rain</label>

                <input
                    type="number"
                    step="any"
                    name="Rain"
                    required
                >

            </div>


            <!-- FFMC -->

            <div class="field">

                <label>FFMC</label>

                <input
                    type="number"
                    step="any"
                    name="FFMC"
                    required
                >

            </div>


            <!-- DMC -->

            <div class="field">

                <label>DMC</label>

                <input
                    type="number"
                    step="any"
                    name="DMC"
                    required
                >

            </div>


            <!-- ISI -->

            <div class="field">

                <label>ISI</label>

                <input
                    type="number"
                    step="any"
                    name="ISI"
                    required
                >

            </div>


            <!-- Classes -->

            <div class="field">

                <label>Classes</label>

                <input
                    type="number"
                    step="any"
                    name="Classes"
                    required
                >

            </div>


            <!-- Region -->

            <div class="field">

                <label>Region</label>

                <input
                    type="number"
                    step="any"
                    name="Region"
                    required
                >

            </div>


        </div>


        <button type="submit">

            🔥 Predict Forest Fire

        </button>


    </form>


    {% if result is defined %}

        <div class="result">

            <h2>Prediction Result</h2>

            <p>{{ result }}</p>

        </div>

    {% endif %}


</div>


</body>

</html>
